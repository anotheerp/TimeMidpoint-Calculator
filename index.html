<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>地铁 · 寻找完美中点</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
    :root {
        --ink: #1b2431;
        --muted: #6f7d90;
        --line: #e6eaf0;
        --brand: #0a84ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: row-reverse;
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        background: #eef1f6;
    }

    /* ---------- 右侧浮动操作区（无底板，直接浮在地图上） ---------- */
    .topbar {
        position: absolute;
        right: 30px;
        top: 28px;
        width: 124px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        z-index: 6;
        pointer-events: none;          /* 空白处不挡地图拖动 */
    }
    .topbar > * { pointer-events: auto; }
    input[type="text"] {
        width: 148px; padding: 9px 12px; font-size: 13px;
        font-family: inherit; color: var(--ink);
        border: 1px solid var(--line); border-radius: 9px; outline: none;
        background: #f7f9fc; transition: .18s;
    }
    input[type="text"]:focus {
        background: #fff; border-color: #9cc8ff;
        box-shadow: 0 0 0 3px rgba(10, 132, 255, .12);
    }

    /* ---------- 站点标签（chips） ---------- */
    .tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tags:empty { display: none; }   /* 没选站时不占位，避免留一段空白 */
    .tag {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 5px 6px 5px 9px; font-size: 12px; font-weight: 600;
        color: #0a6cff; background: #eaf3ff; border-radius: 999px;
        animation: tagIn .18s ease; white-space: normal; word-break: break-all;
        max-width: 100%;
    }
    .tag .rm {
        width: 17px; height: 17px; border: none; border-radius: 50%;
        background: rgba(10, 108, 255, .16); color: #0a6cff;
        font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .tag .rm:hover { background: #0a6cff; color: #fff; }
    @keyframes tagIn { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ---------- 站点搜索建议 ---------- */
    .station-search-wrap { position: relative; width: 100%; }
    input#station-search { width: 100%; height: 38px; }
    .station-suggest {
        position: absolute; left: 0; top: calc(100% + 6px); z-index: 30;
        width: 100%; max-height: 280px; overflow-y: auto;
        background: #fff; border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 10px 30px rgba(23, 43, 77, .14);
        display: none; padding: 4px;
    }
    .station-suggest.open { display: block; }
    .station-suggest .sug {
        padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer;
        color: var(--ink);
    }
    .station-suggest .sug:hover { background: #eef4ff; }
    .station-suggest .sug.disabled { color: #b6c0cf; cursor: not-allowed; }
    .station-suggest .sug.disabled:hover { background: transparent; }
    .station-suggest .sug.empty { color: var(--muted); cursor: default; }
    .station-suggest .sug.empty:hover { background: transparent; }
    /* ---------- 城市选择（地图左上角：无框大字 + 下拉箭头） ---------- */
    .city-panel {
        position: absolute; left: 12px; top: 8px; z-index: 6;
        max-width: 300px;
    }
    .city-trigger {
        display: inline-flex; align-items: center; gap: 3px;
        padding: 2px 6px; margin-left: -6px;
        border: none; background: transparent; border-radius: 8px;
        color: #16181a; font-size: 30px; font-weight: 600; letter-spacing: 1px;
        font-family: inherit; cursor: pointer; transition: .15s;
        white-space: nowrap;      /* 城市名横排，不换行 */
    }
    #city-current { display: inline-block; white-space: nowrap; }
    .city-trigger:hover { background: rgba(22, 24, 26, .05); }
    /* 必须带 #map-container 才能压过 `#map-container svg { width:100% }`，
       否则这个三角会被撑成父容器的 100% 宽高 */
    #map-container .city-caret {
        width: 24px; height: 15px;
        flex: 0 0 auto; transition: transform .18s;
    }
    .city-panel.open .city-caret { transform: rotate(180deg); }
    .city-list {
        display: none; margin-top: 6px; min-width: 170px;
        max-height: 320px; overflow-y: auto; padding: 6px;
        background: rgba(255, 255, 255, .97);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(23, 43, 77, .16);
    }
    .city-panel.open .city-list { display: block; }
    .city-group-title {
        font-size: 11px; font-weight: 700; color: #9aa7ba;
        padding: 9px 6px 3px; letter-spacing: .5px;
    }
    .city-item {
        padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--ink);
        cursor: pointer; transition: .13s; white-space: nowrap;
    }
    .city-item:hover { background: #eef4ff; }
    .city-item.active { background: var(--brand); color: #fff; font-weight: 600; }
    .city-empty { padding: 16px 6px; font-size: 12px; color: var(--muted); text-align: center; }

    .btn {
        padding: 9px 8px; font-size: 12px; font-weight: 600; font-family: inherit;
        color: #fff; cursor: pointer; border: none; border-radius: 9px;
        background: linear-gradient(135deg, #0a84ff, #0060df);
        box-shadow: 0 4px 12px rgba(10, 132, 255, .28);
        transition: .18s;
    }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-icon {
        width: 100%; height: 38px; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid var(--line); border-radius: 9px;
        background: #fff; color: #7a869a; cursor: pointer; transition: .18s;
    }
    .btn-icon:hover { color: #ff3b30; border-color: #ffc9c5; background: #fff6f5; transform: translateY(-1px); }
    .btn-icon:active { transform: translateY(0); }

    /* 中点模式切换按钮：绝对中点时用暖色，与默认的「均衡中点」区分 */
    .btn-mode {
        width: 100%; height: 38px; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        font-family: inherit;
        color: #0060df; cursor: pointer; border-radius: 9px;
        border: 1px solid #bcd9ff; background: #f2f7ff;
        box-shadow: 0 2px 8px rgba(10, 132, 255, .12);
        transition: .18s;
    }
    .btn-mode:hover { filter: brightness(.98); transform: translateY(-1px); }
    .btn-mode:active { transform: translateY(0); }
    .btn-mode.absolute {
        color: #c2410c; border-color: #ffd3ac; background: #fff4e8;
        box-shadow: 0 2px 8px rgba(255, 153, 51, .18);
    }
    /* 两种模式各用一个图标 */
    .btn-mode .icon-abs { display: none; }
    .btn-mode.absolute .icon-fast { display: none; }
    .btn-mode.absolute .icon-abs { display: block; }

    /* 图标按钮 + 下方四字说明 */
    .btn-item { display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
    .btn-item .cap {
        font-size: 10px; color: #6f7d90; text-align: center; letter-spacing: .6px;
        text-shadow: 0 0 4px #fff, 0 0 8px #fff;   /* 浮在地图上时保证可读 */
    }

    /* 结果区：浮在地图上，用半透明白底保证可读性 */
    #result {
        font-size: 12.5px; color: var(--muted); line-height: 1.55; word-break: break-word;
        background: rgba(255, 255, 255, .92);
        border-radius: 9px; padding: 8px 9px;
        box-shadow: 0 4px 14px rgba(23, 43, 77, .10);
    }
    #result:empty { display: none; }
    #result b { color: #0a6cff; }
    #result .res-head {
        font-size: 11px; color: #9aa7ba; letter-spacing: .2px;
        padding-bottom: 6px; border-bottom: 1px dashed var(--line);
    }
    #result .res-best {
        font-size: 17px; font-weight: 700; color: #0a6cff;
        line-height: 1.3; margin: 6px 0 6px;
    }
    #result .res-times { display: flex; flex-direction: column; gap: 2px; }
    #result .res-times .rt {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 6px; font-size: 12px;
    }
    #result .res-times .rt i {
        font-style: normal; color: #7a869a; min-width: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #result .res-times .rt b { color: #1b2431; font-weight: 600; flex: 0 0 auto; }
    #result .res-times .rt b em {
        font-style: normal; font-weight: 400; font-size: 10px; color: #9aa7ba; margin-left: 1px;
    }

    /* ---------- 地图画布 ---------- */
    #map-container {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        margin: 14px 16px 18px 16px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(23, 43, 77, .09);
        overflow: hidden;
    }
    #map-container svg { display: block; width: 100%; height: 100%; cursor: grab; }
    #map-container svg:active { cursor: grabbing; }

    .route { fill: none; transition: stroke .32s ease; }
    .transfer { pointer-events: none; transform-box: fill-box; transform-origin: center; transition: transform .22s cubic-bezier(.34, 1.5, .64, 1); }
    .transfer.hovered { transform: scale(2.76); }
    .station { fill: #000; pointer-events: none; }
    .hl-start {
        fill: #000; stroke: #fff; stroke-linejoin: round; pointer-events: none;
        transform-box: fill-box; transform-origin: center;
        animation: star-in .36s cubic-bezier(.34, 1.56, .64, 1) both;
    }
    @keyframes star-in {
        from { transform: scale(.1) rotate(-60deg); opacity: 0; }
        60% { opacity: 1; }
        to { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .hl-mid { stroke: #fff; stroke-width: 2px; }

    .label {
        fill: #46546a; pointer-events: none; user-select: none;
        stroke: none;          /* 不要白色描边 */
    }
    .label.interchange { fill: #1f2c3d; font-weight: 700; }
    .tip {
        font-weight: 700; fill: #101a26; pointer-events: none;
        paint-order: stroke; stroke: #fff; stroke-width: 4.2px; stroke-linejoin: round;
    }

    /* ---------- 覆盖层 ---------- */
    .legend {
        position: absolute; left: 14px; bottom: 14px;
        background: rgba(255, 255, 255, .93);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line); border-radius: 12px;
        padding: 10px 12px;
        display: grid; grid-template-columns: repeat(2, minmax(74px, auto));
        gap: 5px 16px;
        font-size: 11px; color: #41506a;
        box-shadow: 0 6px 18px rgba(23, 43, 77, .08);
        max-height: 44%; overflow: auto;
    }
    .legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }


    .loading {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(255, 255, 255, .86); font-size: 13px; color: var(--muted);
        transition: opacity .35s; z-index: 3;
    }
    .loading.hide { opacity: 0; pointer-events: none; }

    .zoombox {
        position: absolute; right: 14px; bottom: 14px;
        display: flex; flex-direction: column;
        border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 4px 12px rgba(23, 43, 77, .07);
    }
    .zoombox button {
        width: 30px; height: 30px; border: none; background: transparent;
        color: #56657c; font-size: 16px; line-height: 1; cursor: pointer;
        transition: .15s; font-family: inherit;
    }
    .zoombox button + button { border-top: 1px solid var(--line); }
    .zoombox button:hover { color: var(--brand); background: #f2f7ff; }
</style>
</head>
<body>

<div class="topbar">
    <div class="btn-item">
    <button class="btn-mode" id="btn-mode" title="切换中点算法">
        <svg class="icon-fast" viewBox="0 0 1024 1024" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M512 53.333333c66.581333 0 129.856 14.186667 186.944 39.701334 1.92 0.704 3.754667 1.536 5.504 2.517333l2.837333 1.301333-0.213333 0.341334a35.285333 35.285333 0 1 1-33.237333 61.824l-0.042667 0.106666a385.664 385.664 0 0 0-126.506667-33.642666v57.216c0 12.992-10.538667 23.530667-23.530666 23.530666H500.266667a23.530667 23.530667 0 0 1-23.530667-23.530666V125.482667a386.346667 386.346667 0 0 0-213.056 88.256l40.448 40.469333c9.173333 9.173333 9.173333 24.064 0 33.258667l-16.64 16.64c-9.173333 9.173333-24.085333 9.173333-33.28 0l-40.448-40.448a386.346667 386.346667 0 0 0-88.256 213.056h57.216c12.992 0 23.530667 10.538667 23.530667 23.530666v23.509334c0 13.013333-10.538667 23.530667-23.530667 23.530666H125.482667a386.346667 386.346667 0 0 0 88.256 213.056l40.469333-40.448c9.173333-9.173333 24.064-9.173333 33.258667 0l16.64 16.64c9.173333 9.173333 9.173333 24.085333 0 33.28l-40.448 40.448A386.538667 386.538667 0 0 0 512 900.096c94.464 0 181.034667-33.749333 248.32-89.813333l-40.426667-40.490667a23.530667 23.530667 0 0 1 0-33.258667l16.64-16.64c9.173333-9.173333 24.085333-9.173333 33.28 0l40.448 40.448a386.346667 386.346667 0 0 0 88.256-213.056h-57.216a23.530667 23.530667 0 0 1-23.530666-23.530666V500.266667c0-13.013333 10.538667-23.530667 23.530666-23.530667h57.216a385.706667 385.706667 0 0 0-30.208-118.805333l-4.117333-9.173334a36.096 36.096 0 0 1-3.605333-15.701333 35.285333 35.285333 0 0 1 64.853333-19.285333l0.213333-0.149334 4.693334 10.090667A457.024 457.024 0 0 1 970.666667 512c0 253.312-205.354667 458.666667-458.666667 458.666667S53.333333 765.312 53.333333 512 258.688 53.333333 512 53.333333z m317.674667 141.141334a42.666667 42.666667 0 0 1 0 60.330666L575.893333 508.586667 576 512a64 64 0 0 1-60.245333 63.893333L512 576a64 64 0 0 1 0-128l3.690667 0.106667 253.653333-253.653334a42.666667 42.666667 0 0 1 60.330667 0z"></path>
        </svg>
        <svg class="icon-abs" viewBox="0 0 1024 1024" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M346.709333 426.666667a170.965333 170.965333 0 0 0 0 85.333333H85.333333v-85.333333h261.376z m330.581334 0H938.666667v85.333333h-261.376a170.965333 170.965333 0 0 0 0-85.333333zM512 597.333333a128 128 0 1 1 0-256 128 128 0 0 1 0 256z m271.573333 124.373334l54.314667 54.314666a8.533333 8.533333 0 0 1 0 12.074667l-48.298667 48.256a8.533333 8.533333 0 0 1-12.074666 0l-54.272-54.314667-34.389334 34.389334a8.533333 8.533333 0 0 1-14.336-4.138667l-38.741333-167.765333a8.533333 8.533333 0 0 1 10.24-10.24l167.808 38.698666a8.533333 8.533333 0 0 1 4.096 14.378667l-34.346667 34.346667z"></path>
        </svg>
    </button>
        <span class="cap" id="mode-cap">最快中点</span>
    </div>
    <div class="tags" id="tags"></div>
    <div class="station-search-wrap">
        <input type="text" id="station-search" placeholder="选择地铁站…" />
        <div class="station-suggest" id="station-suggest"></div>
    </div>
    <div class="btn-item">
    <button class="btn-icon" id="btn-find" title="寻找中点" aria-label="寻找中点">
        <svg viewBox="0 0 1024 1024" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M512 928A416 416 0 1 1 928 512 416 416 0 0 1 512 928z m0-768A352 352 0 1 0 864 512 352 352 0 0 0 512 160z m-52.288 507.136a29.12 29.12 0 0 1-16.128 4.864 26.496 26.496 0 0 1-27.584-25.6V377.6a24.192 24.192 0 0 1 5.248-14.912 29.12 29.12 0 0 1 38.4-5.568l200.96 134.4a25.216 25.216 0 0 1 6.4 5.632 24.064 24.064 0 0 1-6.4 35.392z"></path>
        </svg>
    </button>
        <span class="cap">寻找中点</span>
    </div>
    <div class="btn-item">
    <button class="btn-icon" id="btn-clear" title="清除所选站点" aria-label="清除所选站点">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>

            <path d="m5 11 9 9"/>
        </svg>
    </button>
        <span class="cap">清除站点</span>

    <div id="result"></div>
</div>

<div id="map-container">
    <div class="loading" id="loading">正在生成线网图…</div>
    <div class="city-panel" id="city-panel">
        <button class="city-trigger" id="city-trigger" title="选择城市">
            <span id="city-current">杭州</span>
            <svg class="city-caret" viewBox="0 0 14 9" width="24" height="15" aria-hidden="true">
                <path d="M0 0h14L7 9z" fill="currentColor"></path>
            </svg>
        </button>
        <div class="city-list" id="city-list"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="zoombox">
        <button id="btn-zoom-in" title="放大">+</button>
        <button id="btn-zoom-out" title="缩小">&minus;</button>
        <button id="btn-fit" title="查看全图">&#10530;</button>
        <button id="btn-reset" title="重置视图">&#8634;</button>
    </div>
</div>

<script>
/* =====================================================================
   地铁线网图 —— 仿高德地图线路图风格
   1) 数据按站名合并，换乘站只保留一个节点
   2) 站点按真实经纬度投影，线路用平滑曲线穿过每一站，保留真实走向
   3) 普通站为小圆点、换乘站为白底灰环，站名统一排在站点右上方并自动避让
   ===================================================================== */

const TRANSFER_ICON = '/data/transfer.png';
const container = document.getElementById('map-container');
const loadingEl = document.getElementById('loading');
let currentCity = 'hangzhou';   // 当前选中的城市（拼音名）
let CITIES = [];                // 城市清单 [{code, name, label}]

const svg = d3.select(container).insert('svg', ':first-child');
const gRoot = svg.append('g');
const gRoutes = gRoot.append('g').attr('class', 'routes');
const gStations = gRoot.append('g').attr('class', 'stations');
const gHit = gRoot.append('g').attr('class', 'hit-area');
const gHighlight = gRoot.append('g').attr('class', 'highlight');
const gLabels = gRoot.append('g').attr('class', 'labels');
const gHover = gRoot.append('g').attr('class', 'hover');

const zoom = d3.zoom().scaleExtent([0.14, 2.5]).on('zoom', ev => gRoot.attr('transform', ev.transform));
svg.call(zoom);

let MODEL = null;          // 线网模型
let stationData = [];      // 当前渲染的站点数据（供高亮使用）
let labelBoxes = [];       // 常驻站名占位，供悬停站名避让
const MAX_STATIONS = 5;    // 最多添加 5 个站点
let selected = [];         // 已选站点名（按添加顺序）
let midResults = [];       // 后端返回的中点结果 [{station, times, diff, total_time, coords}]
let midMode = 'balanced';  // 中点算法模式：balanced=均衡中点 / absolute=绝对中点

const MODE_TEXT = {
    balanced: { btn: '模式：最快中点', label: '最快中点' },
    absolute: { btn: '模式：绝对中点', label: '绝对中点' },
};

/* 同步模式按钮的配色与悬停提示（按钮本身是图标，靠颜色区分两种模式） */
function renderModeButton() {
    const btn = document.getElementById('btn-mode');
    btn.classList.toggle('absolute', midMode === 'absolute');
    const cur = MODE_TEXT[midMode].label;
    const next = MODE_TEXT[midMode === 'absolute' ? 'balanced' : 'absolute'].label;
    btn.title = `当前：${cur}　点击切换为：${next}`;
    btn.setAttribute('aria-label', btn.title);
    const cap = document.getElementById('mode-cap');
    if (cap) cap.textContent = cur;   // 按钮下方四字说明随模式变化
}

/* ---------------- 1. 构建模型（高德绘制数据：已排版坐标 + 线路路径点） ---------------- */
function buildModel(raw) {
    const routes = [];
    const byName = new Map();

    raw.l.forEach(line => {
        const color = line.cl ? '#' + line.cl : '#8d96a6';
        const name = line.ln || '线路';

        const segments = (line.f || []).map(seg =>
            (seg.c || []).map(pt => {
                const [x, y] = String(pt).trim().split(/\s+/).map(Number);
                return [x, y];
            })
        ).filter(seg => seg.length > 1);

        routes.push({ color, name, segments });

        (line.st || []).forEach(st => {
            const [x, y] = String(st.p).trim().split(/\s+/).map(Number);
            let node = byName.get(st.n);
            if (!node) {
                node = { id: st.n, x, y, colors: new Set() };
                byName.set(st.n, node);
            }
            node.colors.add(color);
        });
    });

    const nodes = [...byName.values()];
    const index = new Map(nodes.map(n => [n.id, n]));

    const box = {
        x0: d3.min(nodes, n => n.x), x1: d3.max(nodes, n => n.x),
        y0: d3.min(nodes, n => n.y), y1: d3.max(nodes, n => n.y)
    };

    // 默认聚焦到线网几何中心（各城市通用）
    const focus = {
        x: (box.x0 + box.x1) / 2, y: (box.y0 + box.y1) / 2
    };

    return { nodes, routes, index, box, focus };
}

/* ---------------- 5. 标签避让 ---------------- */
function textWidth(str, fs) {
    let w = 0;
    for (const ch of str) w += ch.codePointAt(0) > 0x2e80 ? fs : fs * 0.56;
    return w;
}

function labelBox(c, w, fs) {
    const pad = 1.6;
    const h = fs + 2;
    let x0;
    if (c.anchor === 'start') x0 = c.x;
    else if (c.anchor === 'end') x0 = c.x - w;
    else x0 = c.x - w / 2;
    return { x0: x0 - pad, y0: c.y - h / 2 - pad, x1: x0 + w + pad, y1: c.y + h / 2 + pad };
}

function overlapArea(a, b) {
    const w = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
    const h = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
    return w > 0 && h > 0 ? w * h : 0;
}

function buildLabels(stations, showAll) {
    const placed = [];
    const out = [];

    // 换乘站优先占位
    const ordered = stations.slice().sort((p, q) => (q.n.colors.size - p.n.colors.size));

    ordered.forEach(st => {
        const inter = st.n.colors.size > 1;
        if (!showAll && !inter) return;

        const fs = 13;
        const w = textWidth(st.n.id, fs);

        // 官方图默认把站名排在站点右下方
        const cands = [
            { x: st.x + 10, y: st.y + 1, anchor: 'start' },
            { x: st.x - 9, y: st.y + 1, anchor: 'end' },
            { x: st.x + 10, y: st.y - 12, anchor: 'start' },
            { x: st.x - 9, y: st.y - 12, anchor: 'end' },
            { x: st.x, y: st.y - 15, anchor: 'middle' },
            { x: st.x, y: st.y + 15, anchor: 'middle' }
        ];

        let chosen = null, bestArea = Infinity;
        for (const c of cands) {
            const box = labelBox(c, w, fs);
            let area = 0;
            for (const b of placed) area += overlapArea(b, box);
            if (area === 0) { chosen = { c, box }; bestArea = 0; break; }
            if (area < bestArea) { bestArea = area; chosen = { c, box }; }
        }
        if (!chosen || (!inter && bestArea > 0)) return;

        placed.push(chosen.box);
        out.push({
            id: st.n.id, x: chosen.c.x, y: chosen.c.y, anchor: chosen.c.anchor,
            fs, sw: 2.4, inter, box: chosen.box
        });
    });

    return out;
}

/* ---------------- 6. 渲染（1:1 官方坐标，靠 zoom 平移缩放） ---------------- */
const ST_R = 4.8;        // 普通站半径（原 6，按 0.8 倍缩小）
const TR_ICON = 18;      // 换乘站图标尺寸（官方 18px）

function render() {
    if (!MODEL) return;
    const W = container.clientWidth;
    const H = container.clientHeight;
    svg.attr('width', W).attr('height', H);

    const { nodes, routes } = MODEL;

    /* --- 线路：直接用官方路径点 --- */
    const paths = [];
    routes.forEach(r => r.segments.forEach(seg => {
        paths.push({ color: r.color, d: 'M' + seg.map(pt => pt[0] + ',' + pt[1]).join('L') });
    }));

    gRoutes.selectAll('path.route')
        .data(paths)
        .join('path')
        .attr('class', 'route')
        .attr('d', d => d.d)
        .attr('stroke', d => d.color)
        .attr('stroke-width', 5)
        .attr('stroke-linecap', 'butt')
        .attr('stroke-linejoin', 'miter')
        .attr('fill', 'none');

    /* --- 站点 --- */
    stationData = nodes.map(n => ({
        n, x: n.x, y: n.y, inter: n.colors.size > 1, color: [...n.colors][0]
    }));

    gStations.selectAll('circle.station')
        .data(stationData.filter(d => !d.inter), d => d.n.id)
        .join('circle')
        .attr('class', 'station')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', ST_R)
        .attr('fill', '#000')
        .attr('stroke', 'none');

    // 换乘站用官方图标
    gStations.selectAll('image.transfer')
        .data(stationData.filter(d => d.inter), d => d.n.id)
        .join('image')
        .attr('class', 'transfer')
        .attr('href', TRANSFER_ICON)
        .attr('x', d => d.x - TR_ICON / 2)
        .attr('y', d => d.y - TR_ICON / 2)
        .attr('width', TR_ICON)
        .attr('height', TR_ICON);

    /* --- 透明命中层：鼠标触发范围比圆点更大 --- */
    gHit.selectAll('circle.hit')
        .data(stationData, d => d.n.id)
        .join('circle')
        .attr('class', 'hit')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', d => d.inter ? 16 : 13)
        .attr('fill', 'transparent')
        .attr('cursor', 'pointer')
        .on('mouseenter', (ev, d) => onStationEnter(d))
        .on('mouseleave', (ev, d) => onStationLeave(d))
        .on('click', (ev, d) => addStation(d.n.id));

    /* --- 站名 --- */
    const labels = buildLabels(stationData, true);

    gLabels.selectAll('text.label')
        .data(labels, d => d.id)
        .join('text')
        .attr('class', d => 'label' + (d.inter ? ' interchange' : ''))
        .attr('x', d => d.x)
        .attr('y', d => d.y)
        .attr('text-anchor', d => d.anchor)
        .attr('dominant-baseline', 'middle')
        .attr('font-size', d => d.fs)
        .attr('stroke-width', d => d.sw)
        .text(d => d.id);

    labelBoxes = labels.map(l => ({ id: l.id, box: l.box }));
    gHover.selectAll('text.tip').interrupt('tip').remove();
    applyHighlights();
}

/* ---------------- 7. 悬停：站点放大 + 站名放大 ---------------- */
function onStationEnter(d) {
    if (d.inter) {
        gStations.selectAll('image.transfer')
            .filter(s => s.n.id === d.n.id)
            .classed('hovered', true);
    } else {
        gStations.selectAll('circle.station')
            .filter(s => s.n.id === d.n.id)
            .interrupt('hover')
            .transition('hover').duration(200).ease(d3.easeCubicOut)
            .attr('r', ST_R + 7.2)
            .attr('stroke-width', 2.4);
    }
    showTip(d);
}

function onStationLeave(d) {
    if (d.inter) {
        gStations.selectAll('image.transfer')
            .filter(s => s.n.id === d.n.id)
            .classed('hovered', false);
    } else {
        gStations.selectAll('circle.station')
            .filter(s => s.n.id === d.n.id)
            .interrupt('hover')
            .transition('hover').duration(240).ease(d3.easeCubicOut)
            .attr('r', ST_R)
            .attr('stroke-width', 1.4);
    }
    hideTip();
}

function showTip(d) {
    // 该站原本的常驻站名先柔和淡出，避免和放大后的提示叠字
    gLabels.selectAll('text.label')
        .filter(l => l.id === d.n.id)
        .interrupt()
        .transition()
        .duration(90)
        .style('opacity', 0);

    const fs = 24;
    const w = textWidth(d.n.id, fs);
    const W = container.clientWidth;
    // 换乘站图标放大后半径更大，文字要躲开
    const gx = d.inter ? 30 : 16;
    const gy = d.inter ? 20 : 17;
    const cands = [
        { x: d.x + gx, y: d.y, anchor: 'start' },
        { x: d.x - gx, y: d.y, anchor: 'end' },
        { x: d.x, y: d.y - gy - 6, anchor: 'middle' },
        { x: d.x, y: d.y + gy + 6, anchor: 'middle' },
        { x: d.x + gx, y: d.y - gy, anchor: 'start' },
        { x: d.x + gx, y: d.y + gy, anchor: 'start' },
        { x: d.x - gx, y: d.y - gy, anchor: 'end' },
        { x: d.x - gx, y: d.y + gy, anchor: 'end' }
    ];
    if (d.x > W - 130) cands.unshift(cands.splice(1, 1)[0]);   // 靠右边缘时优先放左侧

    let best = cands[0], bestArea = Infinity;
    for (const c of cands) {
        const box = labelBox(c, w, fs);
        let area = 0;
        for (const b of labelBoxes) {
            if (b.id === d.n.id) continue;
            area += overlapArea(b.box, box);
        }
        if (area === 0) { best = c; break; }
        if (area < bestArea) { bestArea = area; best = c; }
    }

    const sel = gHover.selectAll('text.tip').data([d]);
    sel.exit().remove();

    const enter = sel.enter()
        .append('text')
        .attr('class', 'tip')
        .attr('x', best.x)
        .attr('y', best.y + 3)
        .attr('text-anchor', best.anchor)
        .attr('dominant-baseline', 'middle')
        .style('font-size', (fs - 6) + 'px')
        .attr('opacity', 0);

    enter.merge(sel)
        .text(d.n.id)
        .interrupt('tip')
        .transition('tip')
        .duration(210)
        .ease(d3.easeCubicOut)
        .attr('x', best.x)
        .attr('y', best.y)
        .attr('text-anchor', best.anchor)
        .attr('opacity', 1)
        .style('font-size', fs + 'px');
}

function hideTip() {
    gLabels.selectAll('text.label')
        .interrupt()
        .transition()
        .duration(180)
        .style('opacity', 1);

    gHover.selectAll('text.tip')
        .interrupt('tip')
        .transition('tip')
        .duration(140)
        .ease(d3.easeCubicIn)
        .attr('opacity', 0)
        .style('font-size', '16px')
        .remove();
}

/* ---------------- 7. 高亮 ---------------- */
const DIM_ROUTE = '#c9d1dc';   // 找到中点后线网的灰色

/* 找到中点后整张线网转灰，让彩色中点高亮突出；清除后恢复线路原色 */
function applyRouteFocus() {
    const focus = midResults.length > 0;
    gRoutes.selectAll('path.route')
        .attr('stroke', d => (focus ? DIM_ROUTE : d.color));
}

/* 中点配色色卡：红→青渐变，按顺序取色 */
const MID_COLORS = ['#ff6061', '#ffab39', '#ffd224', '#e6ea48', '#37d86f', '#35cdd6'];

/* 已选站点图标：1024 视口的圆角五角星，缩放后以站点坐标为中心绘制 */
const PIN_VIEWBOX = 1024;
const PIN_SIZE = 58 * 0.8;              // 图标整体显示尺寸（px）
const PIN_SCALE = PIN_SIZE / PIN_VIEWBOX;
const PIN_PATH = 'M313.991837 914.285714c-20.37551 0-40.228571-6.269388-56.946939-18.808163-30.302041-21.942857-44.930612-58.514286-38.661225-95.085714l24.032654-141.061225c3.134694-18.285714-3.134694-36.571429-16.195919-49.110204L123.297959 509.910204c-26.644898-26.122449-36.04898-64.261224-24.555102-99.787755 11.493878-35.526531 41.795918-61.126531 78.889796-66.35102l141.583674-20.375511c18.285714-2.612245 33.959184-14.106122 41.795918-30.30204l63.216326-128.522449C440.946939 130.612245 474.383673 109.714286 512 109.714286s71.053061 20.897959 87.24898 54.334694L662.987755 292.571429c8.359184 16.195918 24.032653 27.689796 41.795918 30.30204l141.583674 20.375511c37.093878 5.22449 67.395918 30.82449 78.889796 66.35102 11.493878 35.526531 2.089796 73.665306-24.555102 99.787755l-102.4 99.787755c-13.061224 12.538776-19.330612 31.346939-16.195919 49.110204l24.032654 141.061225c6.269388 37.093878-8.359184 73.142857-38.661225 95.085714-30.302041 21.942857-69.485714 24.555102-102.4 7.314286L538.122449 836.440816c-16.195918-8.359184-35.526531-8.359184-51.722449 0l-126.955102 66.87347c-14.628571 7.314286-30.302041 10.971429-45.453061 10.971428z';

function applyHighlights() {
    const sels = stationData.filter(d => selected.includes(d.n.id));

    // 中点：后端已按当前模式的优先级排序（均衡=总耗时最短优先，绝对=时间差最小优先），
    // 名次越靠前颜色越红、圆点越大；越靠后越偏青、越小
    const coordsOf = new Map(stationData.map(d => [d.n.id, d]));
    const mids = midResults.filter(r => coordsOf.has(r.station));

    const n = mids.length;
    const midData = mids.map((r, i) => {
        const t = n > 1 ? i / (n - 1) : 0;   // 0=最优 1=最末
        const c = coordsOf.get(r.station);
        return {
            station: r.station,
            x: c.x, y: c.y,
            color: MID_COLORS[Math.round(t * (MID_COLORS.length - 1))],
            radius: 13 - t * 7,   // 13px → 6px
        };
    });

    gHighlight.selectAll('circle.hl-mid')
        .data(midData, d => d.station)
        .join('circle')
        .attr('class', 'hl-mid')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', d => d.radius)
        .attr('fill', d => d.color)
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);

    // 已选站点：五角星（外层 g 定位，内层 path 负责入场动画）
    gHighlight.selectAll('g.hl-pin')
        .data(sels, d => d.n.id)
        .join(
            enter => {
                const g = enter.append('g')
                    .attr('class', 'hl-pin')
                    .attr('transform', d => `translate(${d.x},${d.y})`);
                g.append('g')
                    .attr('transform', `scale(${PIN_SCALE}) translate(${-PIN_VIEWBOX / 2},${-PIN_VIEWBOX / 2})`)
                    .append('path')
                    .attr('class', 'hl-start')
                    .attr('d', PIN_PATH)
                    .attr('stroke-width', 2 / PIN_SCALE);
                return g;
            },
            update => update.attr('transform', d => `translate(${d.x},${d.y})`)
        );

    applyRouteFocus();
}

/* ---------------- 8. 寻找中点 ---------------- */
async function findMidpoint() {
    const resultEl = document.getElementById('result');

    if (selected.length < 2) {
        resultEl.textContent = '请至少选择两个站点（点击地图或搜索添加）';
        return;
    }

    resultEl.textContent = '计算中…';

    try {
        const qs = new URLSearchParams({
            city: currentCity,
            stations: selected.join(','),
            mode: midMode,
        });
        const res = await fetch('/api/midpoint?' + qs.toString());
        const data = await res.json();

        if (data.error) {
            resultEl.textContent = data.error;
            midResults = [];
            applyHighlights();
            return;
        }
        if (!data.data || !data.data.length) {
            resultEl.textContent = '没有找到合适的中点，请调整所选站点';
            midResults = [];
            applyHighlights();
            return;
        }

        midResults = data.data;
        applyHighlights();

        const best = data.data[0];
        const label = MODE_TEXT[data.mode === 'absolute' ? 'absolute' : 'balanced'].label;
        const head = data.mode === 'absolute'
            ? `${label} · 时间差 ${best.diff} 分 · 共 ${best.total_time} 分`
            : `${label} · 时间差 ${best.diff} 分`;
        // times 与所选站点一一对应，逐行显示「站名 —— 到中点的分钟数」
        const rows = best.times.map((t, i) =>
            `<span class="rt"><i>${selected[i] || '站点'}</i><b>${t}<em>分</em></b></span>`
        ).join('');
        resultEl.innerHTML = `<div class="res-head">${head}</div>` +
            `<div class="res-best">${best.station}</div>` +
            `<div class="res-times">${rows}</div>`;
    } catch (err) {
        resultEl.textContent = '请求失败：' + err.message;
    }
}

/* ---------------- 8.5 站点标签与搜索添加 ---------------- */
function renderTags() {
    const tagsEl = document.getElementById('tags');
    tagsEl.innerHTML = '';
    if (!selected.length) return;
    selected.forEach(name => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        const label = document.createElement('span');
        label.textContent = name;
        const rm = document.createElement('button');
        rm.className = 'rm';
        rm.textContent = '×';
        rm.title = '移除';
        rm.addEventListener('click', () => removeStation(name));
        tag.appendChild(label);
        tag.appendChild(rm);
        tagsEl.appendChild(tag);
    });
}

function addStation(name, focus = false) {
    if (!name) return;
    if (!MODEL || !MODEL.index.has(name)) return;
    if (selected.includes(name)) return;               // 去重
    if (selected.length >= MAX_STATIONS) {
        document.getElementById('result').textContent = `最多添加 ${MAX_STATIONS} 个站点`;
        return;
    }
    selected.push(name);
    midResults = [];
    renderTags();
    applyHighlights();
    document.getElementById('station-search').value = '';
    hideSuggest();
    document.getElementById('result').textContent = '';
    if (focus) focusStation(name);
}

/* 把地图平滑移到某个站点，并保证有一定放大倍数 */
function focusStation(name) {
    if (!MODEL) return;
    const d = stationData.find(s => s.n.id === name);
    if (!d || typeof d.x !== 'number' || typeof d.y !== 'number') return;
    const k = Math.max(zoom.scale(), 1.5);
    svg.transition()
        .duration(700)
        .ease(d3.easeCubicOut)
        .call(zoom.transform, viewTransform(k, d.x, d.y));
}

function removeStation(name) {
    selected = selected.filter(s => s !== name);
    midResults = [];
    renderTags();
    applyHighlights();
}

function clearAll() {
    selected = [];
    midResults = [];
    renderTags();
    applyHighlights();
    document.getElementById('result').textContent = '';
}

/* ---------------- 8.6 站点搜索建议 ---------------- */
function showSuggest(kw) {
    const el = document.getElementById('station-suggest');
    el.innerHTML = '';
    const words = (kw || '').trim();
    if (!words) { el.classList.remove('open'); return; }

    const matches = stationData.filter(d => d.n.id.includes(words)).slice(0, 8);

    if (!matches.length) {
        const d = document.createElement('div');
        d.className = 'sug empty';
        d.textContent = '没有匹配的站点';
        el.appendChild(d);
    } else {
        matches.forEach(m => {
            const full = selected.includes(m.n.id);
            const atMax = selected.length >= MAX_STATIONS && !full;
            const d = document.createElement('div');
            d.className = 'sug' + (full || atMax ? ' disabled' : '');
            d.textContent = m.n.id + (full ? ' · 已添加' : (atMax ? ' · 已满' : ''));
            if (!full && !atMax) d.addEventListener('click', () => addStation(m.n.id, true));
            el.appendChild(d);
        });
    }
    el.classList.add('open');
}

function hideSuggest() {
    document.getElementById('station-suggest').classList.remove('open');
}

/* ---------------- 9. 图例 ---------------- */
function renderLegend(routes) {
    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    const seen = new Set();

    routes.forEach(r => {
        const key = r.color + '|' + r.name;
        if (seen.has(key)) return;
        seen.add(key);
        const div = document.createElement('div');
        div.innerHTML = `<i style="background:${r.color}"></i>${r.name}`;
        legend.appendChild(div);
    });
}

/* ---------------- 10. 启动 ---------------- */
const VIEW = { k: 0.95 };   // 1:1 官方坐标，默认 0.82 倍，聚焦主城区

function viewTransform(k, cx, cy) {
    const W = container.clientWidth;
    const H = container.clientHeight;
    return d3.zoomIdentity.translate(W / 2 - cx * k, H / 2 - cy * k).scale(k);
}

function applyInitialView(animate) {
    const c = MODEL.focus;
    const t = viewTransform(VIEW.k, c.x, c.y);
    if (animate) svg.transition().duration(380).call(zoom.transform, t);
    else svg.call(zoom.transform, t);
}

function fitAll() {
    const { box } = MODEL;
    const W = container.clientWidth;
    const H = container.clientHeight;
    const k = Math.min(W / (box.x1 - box.x0), H / (box.y1 - box.y0)) * 0.94;
    const t = viewTransform(k, (box.x0 + box.x1) / 2, (box.y0 + box.y1) / 2);
    svg.transition().duration(420).call(zoom.transform, t);
}

function start(raw) {
    MODEL = buildModel(raw);
    renderLegend(MODEL.routes);
    render();
    loadingEl.classList.add('hide');
    applyInitialView(false);
    applyUrlParams();
}

/* 支持通过链接直接带站点，例如 /?city=hangzhou&stations=湘湖,西兴 */
function applyUrlParams() {
    const qs = new URLSearchParams(location.search);
    const st = qs.get('stations');
    if (st) {
        st.split(',').map(s => s.trim()).filter(Boolean).forEach(s => addStation(s));
    }
}

/* 切换到某个城市：加载数据、重建模型并重绘 */
async function loadCity(name) {
    currentCity = name;
    const city = CITIES.find(c => c.name === name);
    const label = city ? city.label : name;
    document.title = label + '地铁 · 寻找完美中点';
    const cur = document.getElementById('city-current');
    if (cur) cur.textContent = label;      // 左上角显示当前城市名
    renderCityList('');                    // 刷新列表里的高亮项

    // 清空上次的结果、站点选择与输入
    selected = [];
    midResults = [];
    renderTags();
    document.getElementById('station-search').value = '';
    hideSuggest();
    document.getElementById('result').textContent = '';

    loadingEl.classList.remove('hide');
    loadingEl.textContent = '正在生成线网图…';

    try {
        const raw = await d3.json(`/data/${name}/${name}_subway.json`);
        // 让 loading 先绘制出来，再做较重的布局计算
        setTimeout(() => {
            try {
                start(raw);
            } catch (e) {
                loadingEl.textContent = '线网图生成失败：' + e.message;
                console.error(e);
            }
        }, 40);
    } catch (err) {
        loadingEl.textContent = '数据加载失败，请确认服务已启动';
        console.error(err);
    }
}

/* ---------- 城市列表面板：按拼音首字母分组 + 搜索 ---------- */
function cityInitial(c) {
    return (c.name[0] || '#').toUpperCase();
}

function cityItemEl(c) {
    const item = document.createElement('div');
    item.className = 'city-item' + (c.name === currentCity ? ' active' : '');
    item.dataset.city = c.name;
    item.textContent = c.label;
    item.addEventListener('click', () => selectCity(c.name));
    return item;
}

function expandCityPanel() {
    document.getElementById('city-panel').classList.add('open');
}

function collapseCityPanel() {
    document.getElementById('city-panel').classList.remove('open');
}

function selectCity(name) {
    loadCity(name);
    collapseCityPanel();
}

function renderCityList(filter) {
    const listEl = document.getElementById('city-list');
    listEl.innerHTML = '';
    const kw = (filter || '').trim().toLowerCase();

    const filtered = CITIES.filter(c =>
        !kw || c.label.includes(kw) || c.name.toLowerCase().includes(kw)
    );

    if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'city-empty';
        empty.textContent = '没有匹配的城市';
        listEl.appendChild(empty);
        return;
    }

    // 搜索状态下平铺显示，不分组
    if (kw) {
        filtered.forEach(c => listEl.appendChild(cityItemEl(c)));
        return;
    }

    // 按拼音首字母分组，组内按拼音排序
    const groups = new Map();
    filtered.forEach(c => {
        const key = cityInitial(c);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(c);
    });
    [...groups.keys()].sort().forEach(key => {
        const title = document.createElement('div');
        title.className = 'city-group-title';
        title.textContent = key;
        listEl.appendChild(title);
        groups.get(key)
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach(c => listEl.appendChild(cityItemEl(c)));
    });
}

/* 从后端拿到城市清单，渲染列表面板并加载默认城市 */
async function initCities() {
    try {
        const res = await fetch('/api/cities');
        const data = await res.json();
        if (data.data) CITIES = data.data;
    } catch (e) {
        console.error('城市清单加载失败', e);
    }

    // 支持通过 URL 指定城市 /?city=shanghai
    const qs = new URLSearchParams(location.search);
    const urlCity = qs.get('city');
    const startCity = (urlCity && CITIES.some(c => c.name === urlCity))
        ? urlCity
        : (CITIES.some(c => c.name === 'hangzhou') ? 'hangzhou'
            : (CITIES[0] ? CITIES[0].name : 'hangzhou'));
    loadCity(startCity);
}

initCities();
renderModeButton();

/* ---------------- 11. 交互 ---------------- */
document.getElementById('city-trigger').addEventListener('click', () => {
    const panel = document.getElementById('city-panel');
    if (panel.classList.contains('open')) {
        collapseCityPanel();
    } else {
        renderCityList('');
        expandCityPanel();
    }
});
document.addEventListener('click', e => {
    const panel = document.getElementById('city-panel');
    if (!panel.contains(e.target)) collapseCityPanel();
    const wrap = document.querySelector('.station-search-wrap');
    if (!wrap.contains(e.target)) hideSuggest();
});
document.getElementById('station-search').addEventListener('input', e => showSuggest(e.target.value));
document.getElementById('station-search').addEventListener('focus', e => {
    if (e.target.value.trim()) showSuggest(e.target.value);
});
document.getElementById('station-search').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const kw = e.target.value.trim();
    if (!kw) return;
    const match = stationData.find(d => d.n.id.includes(kw) && !selected.includes(d.n.id));
    if (match) addStation(match.n.id, true);
});
document.getElementById('btn-find').addEventListener('click', findMidpoint);
document.getElementById('btn-mode').addEventListener('click', () => {
    midMode = midMode === 'absolute' ? 'balanced' : 'absolute';
    renderModeButton();
    if (selected.length >= 2) findMidpoint();   // 已选好站点则立即用新模式重算
});
document.getElementById('btn-clear').addEventListener('click', clearAll);
document.getElementById('btn-reset').addEventListener('click', () => applyInitialView(true));
document.getElementById('btn-zoom-in').addEventListener('click', () => {
    svg.transition().duration(220).call(zoom.scaleBy, 1.3);
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
    svg.transition().duration(220).call(zoom.scaleBy, 1 / 1.3);
});
document.getElementById('btn-fit').addEventListener('click', fitAll);

let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 180);
});
</script>
