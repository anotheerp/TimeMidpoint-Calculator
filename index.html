<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>地铁 · 寻找完美中点</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
    :root {
        --ink: #1b2431;
        --muted: #6f7d90;
        --line: #e6eaf0;
        --brand: #0a84ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        background: #eef1f6;
    }

    /* ---------- 顶部控制栏 ---------- */
    .topbar {
        margin: 14px 16px 0;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        border-radius: 14px;
        box-shadow: 0 6px 22px rgba(23, 43, 77, 0.08);
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        z-index: 5;
    }
    input[type="text"] {
        width: 148px; padding: 9px 12px; font-size: 13px;
        font-family: inherit; color: var(--ink);
        border: 1px solid var(--line); border-radius: 9px; outline: none;
        background: #f7f9fc; transition: .18s;
    }
    input[type="text"]:focus {
        background: #fff; border-color: #9cc8ff;
        box-shadow: 0 0 0 3px rgba(10, 132, 255, .12);
    }

    /* ---------- 站点标签（chips） ---------- */
    .tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tags .hint { font-size: 12px; color: var(--muted); }
    .tag {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 7px 6px 12px; font-size: 13px; font-weight: 600;
        color: #0a6cff; background: #eaf3ff; border-radius: 999px;
        animation: tagIn .18s ease; white-space: nowrap;
    }
    .tag .rm {
        width: 17px; height: 17px; border: none; border-radius: 50%;
        background: rgba(10, 108, 255, .16); color: #0a6cff;
        font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .tag .rm:hover { background: #0a6cff; color: #fff; }
    @keyframes tagIn { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ---------- 站点搜索建议 ---------- */
    .station-search-wrap { position: relative; }
    input#station-search { width: 230px; }
    .station-suggest {
        position: absolute; left: 0; top: calc(100% + 6px); z-index: 30;
        min-width: 190px; max-height: 280px; overflow-y: auto;
        background: #fff; border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 10px 30px rgba(23, 43, 77, .14);
        display: none; padding: 4px;
    }
    .station-suggest.open { display: block; }
    .station-suggest .sug {
        padding: 8px 10px; font-size: 13px; border-radius: 7px; cursor: pointer;
        color: var(--ink);
    }
    .station-suggest .sug:hover { background: #eef4ff; }
    .station-suggest .sug.disabled { color: #b6c0cf; cursor: not-allowed; }
    .station-suggest .sug.disabled:hover { background: transparent; }
    .station-suggest .sug.empty { color: var(--muted); cursor: default; }
    .station-suggest .sug.empty:hover { background: transparent; }
    /* ---------- 城市面板（地图左上角） ---------- */
    .city-panel {
        position: absolute; left: 14px; top: 14px; z-index: 6;
        width: 108px;
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line); border-radius: 14px;
        box-shadow: 0 10px 30px rgba(23, 43, 77, .12);
        overflow: hidden;
    }
    input.city-search {
        width: 100%; padding: 10px 12px; font-size: 13px;
        border: none; outline: none; font-family: inherit; color: var(--ink);
        background: #f7f9fc; border-radius: 0; cursor: pointer;
    }
    .city-panel.open input.city-search { border-bottom: 1px solid var(--line); }
    input.city-search:focus { background: #fff; box-shadow: none; }
    .city-list { display: none; overflow-y: auto; max-height: 340px; padding: 4px 8px 10px; }
    .city-panel.open .city-list { display: block; }
    .city-group-title {
        font-size: 11px; font-weight: 700; color: #9aa7ba;
        padding: 9px 6px 3px; letter-spacing: .5px;
    }
    .city-item {
        padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--ink);
        cursor: pointer; transition: .13s; white-space: nowrap;
    }
    .city-item:hover { background: #eef4ff; }
    .city-item.active { background: var(--brand); color: #fff; font-weight: 600; }
    .city-empty { padding: 16px 6px; font-size: 12px; color: var(--muted); text-align: center; }

    .btn {
        padding: 9px 18px; font-size: 13px; font-weight: 600; font-family: inherit;
        color: #fff; cursor: pointer; border: none; border-radius: 9px;
        background: linear-gradient(135deg, #0a84ff, #0060df);
        box-shadow: 0 4px 12px rgba(10, 132, 255, .28);
        transition: .18s;
    }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-icon {
        width: 38px; height: 38px; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid var(--line); border-radius: 9px;
        background: #fff; color: #7a869a; cursor: pointer; transition: .18s;
    }
    .btn-icon:hover { color: #ff3b30; border-color: #ffc9c5; background: #fff6f5; transform: translateY(-1px); }
    .btn-icon:active { transform: translateY(0); }

    #result { font-size: 12.5px; color: var(--muted); }
    #result b { color: #0a6cff; }

    /* ---------- 地图画布 ---------- */
    #map-container {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        margin: 14px 16px 16px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(23, 43, 77, .09);
        overflow: hidden;
    }
    #map-container svg { display: block; width: 100%; height: 100%; cursor: grab; }
    #map-container svg:active { cursor: grabbing; }

    .route { fill: none; transition: stroke .32s ease; }
    .transfer { pointer-events: none; transform-box: fill-box; transform-origin: center; transition: transform .22s cubic-bezier(.34, 1.5, .64, 1); }
    .transfer.hovered { transform: scale(2.76); }
    .station { fill: #fff; pointer-events: none; }
    .hl-start { fill: #0a84ff; stroke: #fff; stroke-width: 2.6px; }
    .hl-mid { stroke: #fff; stroke-width: 2px; }

    .label {
        fill: #46546a; pointer-events: none; user-select: none;
        paint-order: stroke; stroke: #fff; stroke-linejoin: round;
    }
    .label.interchange { fill: #1f2c3d; font-weight: 700; }
    .tip {
        font-weight: 700; fill: #101a26; pointer-events: none;
        paint-order: stroke; stroke: #fff; stroke-width: 4.2px; stroke-linejoin: round;
    }

    /* ---------- 覆盖层 ---------- */
    .legend {
        position: absolute; right: 14px; bottom: 14px;
        background: rgba(255, 255, 255, .93);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line); border-radius: 12px;
        padding: 10px 12px;
        display: grid; grid-template-columns: repeat(2, minmax(74px, auto));
        gap: 5px 16px;
        font-size: 11px; color: #41506a;
        box-shadow: 0 6px 18px rgba(23, 43, 77, .08);
        max-height: 44%; overflow: auto;
    }
    .legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }


    .loading {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(255, 255, 255, .86); font-size: 13px; color: var(--muted);
        transition: opacity .35s; z-index: 3;
    }
    .loading.hide { opacity: 0; pointer-events: none; }

    .zoombox {
        position: absolute; right: 14px; top: 14px;
        display: flex; flex-direction: column;
        border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 4px 12px rgba(23, 43, 77, .07);
    }
    .zoombox button {
        width: 30px; height: 30px; border: none; background: transparent;
        color: #56657c; font-size: 16px; line-height: 1; cursor: pointer;
        transition: .15s; font-family: inherit;
    }
    .zoombox button + button { border-top: 1px solid var(--line); }
    .zoombox button:hover { color: var(--brand); background: #f2f7ff; }
</style>
</head>
<body>

<div class="topbar">
    <div class="tags" id="tags"></div>
    <div class="station-search-wrap">
        <input type="text" id="station-search" placeholder="点击地图选站，或在此搜索…" />
        <div class="station-suggest" id="station-suggest"></div>
    </div>
    <button class="btn" id="btn-find">寻找中点</button>
    <button class="btn-icon" id="btn-clear" title="清除所选站点" aria-label="清除所选站点">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
            <path d="M22 21H7"/>
            <path d="m5 11 9 9"/>
        </svg>
    </button>
    <div id="result"></div>
</div>

<div id="map-container">
    <div class="loading" id="loading">正在生成线网图…</div>
    <div class="city-panel" id="city-panel">
        <input type="text" id="city-search" class="city-search" placeholder="搜索城市…" />
        <div class="city-list" id="city-list"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="zoombox">
        <button id="btn-zoom-in" title="放大">+</button>
        <button id="btn-zoom-out" title="缩小">&minus;</button>
        <button id="btn-fit" title="查看全图">&#10530;</button>
        <button id="btn-reset" title="重置视图">&#8634;</button>
    </div>
</div>

<script>
/* =====================================================================
   地铁线网图 —— 仿高德地图线路图风格
   1) 数据按站名合并，换乘站只保留一个节点
   2) 站点按真实经纬度投影，线路用平滑曲线穿过每一站，保留真实走向
   3) 普通站为小圆点、换乘站为白底灰环，站名统一排在站点右上方并自动避让
   ===================================================================== */

const TRANSFER_ICON = '/data/transfer.png';
const container = document.getElementById('map-container');
const loadingEl = document.getElementById('loading');
let currentCity = 'hangzhou';   // 当前选中的城市（拼音名）
let CITIES = [];                // 城市清单 [{code, name, label}]

const svg = d3.select(container).insert('svg', ':first-child');
const gRoot = svg.append('g');
const gRoutes = gRoot.append('g').attr('class', 'routes');
const gStations = gRoot.append('g').attr('class', 'stations');
const gHit = gRoot.append('g').attr('class', 'hit-area');
const gHighlight = gRoot.append('g').attr('class', 'highlight');
const gLabels = gRoot.append('g').attr('class', 'labels');
const gHover = gRoot.append('g').attr('class', 'hover');

const zoom = d3.zoom().scaleExtent([0.14, 2.5]).on('zoom', ev => gRoot.attr('transform', ev.transform));
svg.call(zoom);

let MODEL = null;          // 线网模型
let stationData = [];      // 当前渲染的站点数据（供高亮使用）
let labelBoxes = [];       // 常驻站名占位，供悬停站名避让
const MAX_STATIONS = 5;    // 最多添加 5 个站点
let selected = [];         // 已选站点名（按添加顺序）
let midResults = [];       // 后端返回的中点结果 [{station, times, diff, total_time, coords}]

/* ---------------- 1. 构建模型（高德绘制数据：已排版坐标 + 线路路径点） ---------------- */
function buildModel(raw) {
    const routes = [];
    const byName = new Map();

    raw.l.forEach(line => {
        const color = line.cl ? '#' + line.cl : '#8d96a6';
        const name = line.ln || '线路';

        const segments = (line.f || []).map(seg =>
            (seg.c || []).map(pt => {
                const [x, y] = String(pt).trim().split(/\s+/).map(Number);
                return [x, y];
            })
        ).filter(seg => seg.length > 1);

        routes.push({ color, name, segments });

        (line.st || []).forEach(st => {
            const [x, y] = String(st.p).trim().split(/\s+/).map(Number);
            let node = byName.get(st.n);
            if (!node) {
                node = { id: st.n, x, y, colors: new Set() };
                byName.set(st.n, node);
            }
            node.colors.add(color);
        });
    });

    const nodes = [...byName.values()];
    const index = new Map(nodes.map(n => [n.id, n]));

    const box = {
        x0: d3.min(nodes, n => n.x), x1: d3.max(nodes, n => n.x),
        y0: d3.min(nodes, n => n.y), y1: d3.max(nodes, n => n.y)
    };

    // 默认聚焦到线网几何中心（各城市通用）
    const focus = {
        x: (box.x0 + box.x1) / 2, y: (box.y0 + box.y1) / 2
    };

    return { nodes, routes, index, box, focus };
}

/* ---------------- 5. 标签避让 ---------------- */
function textWidth(str, fs) {
    let w = 0;
    for (const ch of str) w += ch.codePointAt(0) > 0x2e80 ? fs : fs * 0.56;
    return w;
}

function labelBox(c, w, fs) {
    const pad = 1.6;
    const h = fs + 2;
    let x0;
    if (c.anchor === 'start') x0 = c.x;
    else if (c.anchor === 'end') x0 = c.x - w;
    else x0 = c.x - w / 2;
    return { x0: x0 - pad, y0: c.y - h / 2 - pad, x1: x0 + w + pad, y1: c.y + h / 2 + pad };
}

function overlapArea(a, b) {
    const w = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
    const h = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
    return w > 0 && h > 0 ? w * h : 0;
}

function buildLabels(stations, showAll) {
    const placed = [];
    const out = [];

    // 换乘站优先占位
    const ordered = stations.slice().sort((p, q) => (q.n.colors.size - p.n.colors.size));

    ordered.forEach(st => {
        const inter = st.n.colors.size > 1;
        if (!showAll && !inter) return;

        const fs = 13;
        const w = textWidth(st.n.id, fs);

        // 官方图默认把站名排在站点右下方
        const cands = [
            { x: st.x + 10, y: st.y + 1, anchor: 'start' },
            { x: st.x - 9, y: st.y + 1, anchor: 'end' },
            { x: st.x + 10, y: st.y - 12, anchor: 'start' },
            { x: st.x - 9, y: st.y - 12, anchor: 'end' },
            { x: st.x, y: st.y - 15, anchor: 'middle' },
            { x: st.x, y: st.y + 15, anchor: 'middle' }
        ];

        let chosen = null, bestArea = Infinity;
        for (const c of cands) {
            const box = labelBox(c, w, fs);
            let area = 0;
            for (const b of placed) area += overlapArea(b, box);
            if (area === 0) { chosen = { c, box }; bestArea = 0; break; }
            if (area < bestArea) { bestArea = area; chosen = { c, box }; }
        }
        if (!chosen || (!inter && bestArea > 0)) return;

        placed.push(chosen.box);
        out.push({
            id: st.n.id, x: chosen.c.x, y: chosen.c.y, anchor: chosen.c.anchor,
            fs, sw: 2.4, inter, box: chosen.box
        });
    });

    return out;
}

/* ---------------- 6. 渲染（1:1 官方坐标，靠 zoom 平移缩放） ---------------- */
const ST_R = 6;          // 普通站半径（官方 3px，这里放大一倍便于点击）
const TR_ICON = 18;      // 换乘站图标尺寸（官方 18px）

function render() {
    if (!MODEL) return;
    const W = container.clientWidth;
    const H = container.clientHeight;
    svg.attr('width', W).attr('height', H);

    const { nodes, routes } = MODEL;

    /* --- 线路：直接用官方路径点 --- */
    const paths = [];
    routes.forEach(r => r.segments.forEach(seg => {
        paths.push({ color: r.color, d: 'M' + seg.map(pt => pt[0] + ',' + pt[1]).join('L') });
    }));

    gRoutes.selectAll('path.route')
        .data(paths)
        .join('path')
        .attr('class', 'route')
        .attr('d', d => d.d)
        .attr('stroke', d => d.color)
        .attr('stroke-width', 5)
        .attr('stroke-linecap', 'butt')
        .attr('stroke-linejoin', 'miter')
        .attr('fill', 'none');

    /* --- 站点 --- */
    stationData = nodes.map(n => ({
        n, x: n.x, y: n.y, inter: n.colors.size > 1, color: [...n.colors][0]
    }));

    gStations.selectAll('circle.station')
        .data(stationData.filter(d => !d.inter), d => d.n.id)
        .join('circle')
        .attr('class', 'station')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', ST_R)
        .attr('fill', '#fff')
        .attr('stroke', '#000')
        .attr('stroke-width', 1.4);

    // 换乘站用官方图标
    gStations.selectAll('image.transfer')
        .data(stationData.filter(d => d.inter), d => d.n.id)
        .join('image')
        .attr('class', 'transfer')
        .attr('href', TRANSFER_ICON)
        .attr('x', d => d.x - TR_ICON / 2)
        .attr('y', d => d.y - TR_ICON / 2)
        .attr('width', TR_ICON)
        .attr('height', TR_ICON);

    /* --- 透明命中层：鼠标触发范围比圆点更大 --- */
    gHit.selectAll('circle.hit')
        .data(stationData, d => d.n.id)
        .join('circle')
        .attr('class', 'hit')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', d => d.inter ? 16 : 13)
        .attr('fill', 'transparent')
        .attr('cursor', 'pointer')
        .on('mouseenter', (ev, d) => onStationEnter(d))
        .on('mouseleave', (ev, d) => onStationLeave(d))
        .on('click', (ev, d) => addStation(d.n.id));

    /* --- 站名 --- */
    const labels = buildLabels(stationData, true);

    gLabels.selectAll('text.label')
        .data(labels, d => d.id)
        .join('text')
        .attr('class', d => 'label' + (d.inter ? ' interchange' : ''))
        .attr('x', d => d.x)
        .attr('y', d => d.y)
        .attr('text-anchor', d => d.anchor)
        .attr('dominant-baseline', 'middle')
        .attr('font-size', d => d.fs)
        .attr('stroke-width', d => d.sw)
        .text(d => d.id);

    labelBoxes = labels.map(l => ({ id: l.id, box: l.box }));
    gHover.selectAll('text.tip').interrupt('tip').remove();
    applyHighlights();
}

/* ---------------- 7. 悬停：站点放大 + 站名放大 ---------------- */
function onStationEnter(d) {
    if (d.inter) {
        gStations.selectAll('image.transfer')
            .filter(s => s.n.id === d.n.id)
            .classed('hovered', true);
    } else {
        gStations.selectAll('circle.station')
            .filter(s => s.n.id === d.n.id)
            .interrupt('hover')
            .transition('hover').duration(200).ease(d3.easeCubicOut)
            .attr('r', ST_R + 7.2)
            .attr('stroke-width', 2.4);
    }
    showTip(d);
}

function onStationLeave(d) {
    if (d.inter) {
        gStations.selectAll('image.transfer')
            .filter(s => s.n.id === d.n.id)
            .classed('hovered', false);
    } else {
        gStations.selectAll('circle.station')
            .filter(s => s.n.id === d.n.id)
            .interrupt('hover')
            .transition('hover').duration(240).ease(d3.easeCubicOut)
            .attr('r', ST_R)
            .attr('stroke-width', 1.4);
    }
    hideTip();
}

function showTip(d) {
    // 该站原本的常驻站名先柔和淡出，避免和放大后的提示叠字
    gLabels.selectAll('text.label')
        .filter(l => l.id === d.n.id)
        .interrupt()
        .transition()
        .duration(90)
        .style('opacity', 0);

    const fs = 24;
    const w = textWidth(d.n.id, fs);
    const W = container.clientWidth;
    // 换乘站图标放大后半径更大，文字要躲开
    const gx = d.inter ? 30 : 16;
    const gy = d.inter ? 20 : 17;
    const cands = [
        { x: d.x + gx, y: d.y, anchor: 'start' },
        { x: d.x - gx, y: d.y, anchor: 'end' },
        { x: d.x, y: d.y - gy - 6, anchor: 'middle' },
        { x: d.x, y: d.y + gy + 6, anchor: 'middle' },
        { x: d.x + gx, y: d.y - gy, anchor: 'start' },
        { x: d.x + gx, y: d.y + gy, anchor: 'start' },
        { x: d.x - gx, y: d.y - gy, anchor: 'end' },
        { x: d.x - gx, y: d.y + gy, anchor: 'end' }
    ];
    if (d.x > W - 130) cands.unshift(cands.splice(1, 1)[0]);   // 靠右边缘时优先放左侧

    let best = cands[0], bestArea = Infinity;
    for (const c of cands) {
        const box = labelBox(c, w, fs);
        let area = 0;
        for (const b of labelBoxes) {
            if (b.id === d.n.id) continue;
            area += overlapArea(b.box, box);
        }
        if (area === 0) { best = c; break; }
        if (area < bestArea) { bestArea = area; best = c; }
    }

    const sel = gHover.selectAll('text.tip').data([d]);
    sel.exit().remove();

    const enter = sel.enter()
        .append('text')
        .attr('class', 'tip')
        .attr('x', best.x)
        .attr('y', best.y + 3)
        .attr('text-anchor', best.anchor)
        .attr('dominant-baseline', 'middle')
        .style('font-size', (fs - 6) + 'px')
        .attr('opacity', 0);

    enter.merge(sel)
        .text(d.n.id)
        .interrupt('tip')
        .transition('tip')
        .duration(210)
        .ease(d3.easeCubicOut)
        .attr('x', best.x)
        .attr('y', best.y)
        .attr('text-anchor', best.anchor)
        .attr('opacity', 1)
        .style('font-size', fs + 'px');
}

function hideTip() {
    gLabels.selectAll('text.label')
        .interrupt()
        .transition()
        .duration(180)
        .style('opacity', 1);

    gHover.selectAll('text.tip')
        .interrupt('tip')
        .transition('tip')
        .duration(140)
        .ease(d3.easeCubicIn)
        .attr('opacity', 0)
        .style('font-size', '16px')
        .remove();
}

/* ---------------- 7. 高亮 ---------------- */
const DIM_ROUTE = '#c9d1dc';   // 找到中点后线网的灰色

/* 找到中点后整张线网转灰，让彩色中点高亮突出；清除后恢复线路原色 */
function applyRouteFocus() {
    const focus = midResults.length > 0;
    gRoutes.selectAll('path.route')
        .attr('stroke', d => (focus ? DIM_ROUTE : d.color));
}

/* 中点配色：PANTONE 色卡顺序（红→橙→黄→绿→青→深蓝→紫，不含 183 C） */
const MID_COLORS = ['#ff3445', '#ff8902', '#f4d717', '#00ba72', '#00c2df', '#00418d', '#602879'];

function applyHighlights() {
    const sels = stationData.filter(d => selected.includes(d.n.id));

    // 中点：按「平均到达时间」映射色卡颜色(近→远) 与 大小(大→小)
    const coordsOf = new Map(stationData.map(d => [d.n.id, d]));
    const mids = midResults
        .map(r => ({ ...r, avg: r.total_time / (r.times ? r.times.length : 1) }))
        .filter(r => coordsOf.has(r.station));

    const avgs = mids.map(r => r.avg);
    const minAvg = avgs.length ? Math.min(...avgs) : 0;
    const maxAvg = avgs.length ? Math.max(...avgs) : 0;
    const span = (maxAvg - minAvg) || 1;

    const midData = mids.map(r => {
        const t = Math.min(1, Math.max(0, (r.avg - minAvg) / span)); // 0=最近 1=最远
        const c = coordsOf.get(r.station);
        return {
            station: r.station,
            x: c.x, y: c.y,
            color: MID_COLORS[Math.round(t * (MID_COLORS.length - 1))],
            radius: 13 - t * 7,   // 13px → 6px
        };
    });

    gHighlight.selectAll('circle.hl-mid')
        .data(midData, d => d.station)
        .join('circle')
        .attr('class', 'hl-mid')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', d => d.radius)
        .attr('fill', d => d.color)
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);

    gHighlight.selectAll('circle.hl-start')
        .data(sels, d => d.n.id)
        .join('circle')
        .attr('class', 'hl-start')
        .attr('cx', d => d.x).attr('cy', d => d.y)
        .attr('r', 7.5);

    applyRouteFocus();
}

/* ---------------- 8. 寻找中点 ---------------- */
async function findMidpoint() {
    const resultEl = document.getElementById('result');

    if (selected.length < 2) {
        resultEl.textContent = '请至少选择两个站点（点击地图或搜索添加）';
        return;
    }

    resultEl.textContent = '计算中…';

    try {
        const qs = new URLSearchParams({
            city: currentCity,
            stations: selected.join(','),
        });
        const res = await fetch('/api/midpoint?' + qs.toString());
        const data = await res.json();

        if (data.error) {
            resultEl.textContent = data.error;
            midResults = [];
            applyHighlights();
            return;
        }
        if (!data.data || !data.data.length) {
            resultEl.textContent = '没有找到合适的中点，请调整所选站点';
            midResults = [];
            applyHighlights();
            return;
        }

        midResults = data.data;
        applyHighlights();

        const best = data.data[0];
        const times = best.times.join('/');
        resultEl.innerHTML = `最佳中点 <b>${best.station}</b> · 到各站 ${times} 分钟 · 时间差 ${best.diff} 分钟`;
    } catch (err) {
        resultEl.textContent = '请求失败：' + err.message;
    }
}

/* ---------------- 8.5 站点标签与搜索添加 ---------------- */
function renderTags() {
    const tagsEl = document.getElementById('tags');
    tagsEl.innerHTML = '';
    if (!selected.length) {
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = '点击地图选站';
        tagsEl.appendChild(hint);
        return;
    }
    selected.forEach(name => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        const label = document.createElement('span');
        label.textContent = name;
        const rm = document.createElement('button');
        rm.className = 'rm';
        rm.textContent = '×';
        rm.title = '移除';
        rm.addEventListener('click', () => removeStation(name));
        tag.appendChild(label);
        tag.appendChild(rm);
        tagsEl.appendChild(tag);
    });
}

function addStation(name) {
    if (!name) return;
    if (!MODEL || !MODEL.index.has(name)) return;
    if (selected.includes(name)) return;               // 去重
    if (selected.length >= MAX_STATIONS) {
        document.getElementById('result').textContent = `最多添加 ${MAX_STATIONS} 个站点`;
        return;
    }
    selected.push(name);
    midResults = [];
    renderTags();
    applyHighlights();
    document.getElementById('station-search').value = '';
    hideSuggest();
    document.getElementById('result').textContent = '';
}

function removeStation(name) {
    selected = selected.filter(s => s !== name);
    midResults = [];
    renderTags();
    applyHighlights();
}

function clearAll() {
    selected = [];
    midResults = [];
    renderTags();
    applyHighlights();
    document.getElementById('result').textContent = '';
}

/* ---------------- 8.6 站点搜索建议 ---------------- */
function showSuggest(kw) {
    const el = document.getElementById('station-suggest');
    el.innerHTML = '';
    const words = (kw || '').trim();
    if (!words) { el.classList.remove('open'); return; }

    const matches = stationData.filter(d => d.n.id.includes(words)).slice(0, 8);

    if (!matches.length) {
        const d = document.createElement('div');
        d.className = 'sug empty';
        d.textContent = '没有匹配的站点';
        el.appendChild(d);
    } else {
        matches.forEach(m => {
            const full = selected.includes(m.n.id);
            const atMax = selected.length >= MAX_STATIONS && !full;
            const d = document.createElement('div');
            d.className = 'sug' + (full || atMax ? ' disabled' : '');
            d.textContent = m.n.id + (full ? ' · 已添加' : (atMax ? ' · 已满' : ''));
            if (!full && !atMax) d.addEventListener('click', () => addStation(m.n.id));
            el.appendChild(d);
        });
    }
    el.classList.add('open');
}

function hideSuggest() {
    document.getElementById('station-suggest').classList.remove('open');
}

/* ---------------- 9. 图例 ---------------- */
function renderLegend(routes) {
    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    const seen = new Set();

    routes.forEach(r => {
        const key = r.color + '|' + r.name;
        if (seen.has(key)) return;
        seen.add(key);
        const div = document.createElement('div');
        div.innerHTML = `<i style="background:${r.color}"></i>${r.name}`;
        legend.appendChild(div);
    });
}

/* ---------------- 10. 启动 ---------------- */
const VIEW = { k: 0.95 };   // 1:1 官方坐标，默认 0.82 倍，聚焦主城区

function viewTransform(k, cx, cy) {
    const W = container.clientWidth;
    const H = container.clientHeight;
    return d3.zoomIdentity.translate(W / 2 - cx * k, H / 2 - cy * k).scale(k);
}

function applyInitialView(animate) {
    const c = MODEL.focus;
    const t = viewTransform(VIEW.k, c.x, c.y);
    if (animate) svg.transition().duration(380).call(zoom.transform, t);
    else svg.call(zoom.transform, t);
}

function fitAll() {
    const { box } = MODEL;
    const W = container.clientWidth;
    const H = container.clientHeight;
    const k = Math.min(W / (box.x1 - box.x0), H / (box.y1 - box.y0)) * 0.94;
    const t = viewTransform(k, (box.x0 + box.x1) / 2, (box.y0 + box.y1) / 2);
    svg.transition().duration(420).call(zoom.transform, t);
}

function start(raw) {
    MODEL = buildModel(raw);
    renderLegend(MODEL.routes);
    render();
    loadingEl.classList.add('hide');
    applyInitialView(false);
    applyUrlParams();
}

/* 支持通过链接直接带站点，例如 /?city=hangzhou&stations=湘湖,西兴 */
function applyUrlParams() {
    const qs = new URLSearchParams(location.search);
    const st = qs.get('stations');
    if (st) {
        st.split(',').map(s => s.trim()).filter(Boolean).forEach(s => addStation(s));
    }
}

/* 切换到某个城市：加载数据、重建模型并重绘 */
async function loadCity(name) {
    currentCity = name;
    const city = CITIES.find(c => c.name === name);
    const label = city ? city.label : name;
    document.title = label + '地铁 · 寻找完美中点';
    renderCityList(document.getElementById('city-search').value);   // 刷新左侧列表的高亮

    // 清空上次的结果、站点选择与输入
    selected = [];
    midResults = [];
    renderTags();
    document.getElementById('station-search').value = '';
    hideSuggest();
    document.getElementById('result').textContent = '';

    loadingEl.classList.remove('hide');
    loadingEl.textContent = '正在生成线网图…';

    try {
        const raw = await d3.json(`/data/${name}/${name}_subway.json`);
        // 让 loading 先绘制出来，再做较重的布局计算
        setTimeout(() => {
            try {
                start(raw);
            } catch (e) {
                loadingEl.textContent = '线网图生成失败：' + e.message;
                console.error(e);
            }
        }, 40);
    } catch (err) {
        loadingEl.textContent = '数据加载失败，请确认服务已启动';
        console.error(err);
    }
}

/* ---------- 城市列表面板：按拼音首字母分组 + 搜索 ---------- */
function cityInitial(c) {
    return (c.name[0] || '#').toUpperCase();
}

function cityItemEl(c) {
    const item = document.createElement('div');
    item.className = 'city-item' + (c.name === currentCity ? ' active' : '');
    item.dataset.city = c.name;
    item.textContent = c.label;
    item.addEventListener('click', () => selectCity(c.name));
    return item;
}

function expandCityPanel() {
    document.getElementById('city-panel').classList.add('open');
}

function collapseCityPanel() {
    document.getElementById('city-panel').classList.remove('open');
}

function selectCity(name) {
    loadCity(name);
    collapseCityPanel();
    const search = document.getElementById('city-search');
    search.value = '';
    renderCityList('');
}

function renderCityList(filter) {
    const listEl = document.getElementById('city-list');
    listEl.innerHTML = '';
    const kw = (filter || '').trim().toLowerCase();

    const filtered = CITIES.filter(c =>
        !kw || c.label.includes(kw) || c.name.toLowerCase().includes(kw)
    );

    if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'city-empty';
        empty.textContent = '没有匹配的城市';
        listEl.appendChild(empty);
        return;
    }

    // 搜索状态下平铺显示，不分组
    if (kw) {
        filtered.forEach(c => listEl.appendChild(cityItemEl(c)));
        return;
    }

    // 按拼音首字母分组，组内按拼音排序
    const groups = new Map();
    filtered.forEach(c => {
        const key = cityInitial(c);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(c);
    });
    [...groups.keys()].sort().forEach(key => {
        const title = document.createElement('div');
        title.className = 'city-group-title';
        title.textContent = key;
        listEl.appendChild(title);
        groups.get(key)
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach(c => listEl.appendChild(cityItemEl(c)));
    });
}

/* 从后端拿到城市清单，渲染列表面板并加载默认城市 */
async function initCities() {
    try {
        const res = await fetch('/api/cities');
        const data = await res.json();
        if (data.data) CITIES = data.data;
    } catch (e) {
        console.error('城市清单加载失败', e);
    }

    // 支持通过 URL 指定城市 /?city=shanghai
    const qs = new URLSearchParams(location.search);
    const urlCity = qs.get('city');
    const startCity = (urlCity && CITIES.some(c => c.name === urlCity))
        ? urlCity
        : (CITIES[0] ? CITIES[0].name : 'hangzhou');
    loadCity(startCity);
}

initCities();

/* ---------------- 11. 交互 ---------------- */
document.getElementById('city-search').addEventListener('click', expandCityPanel);
document.getElementById('city-search').addEventListener('input', e => {
    expandCityPanel();
    renderCityList(e.target.value);
});
document.addEventListener('click', e => {
    const panel = document.getElementById('city-panel');
    if (!panel.contains(e.target)) collapseCityPanel();
    const wrap = document.querySelector('.station-search-wrap');
    if (!wrap.contains(e.target)) hideSuggest();
});
document.getElementById('station-search').addEventListener('input', e => showSuggest(e.target.value));
document.getElementById('station-search').addEventListener('focus', e => {
    if (e.target.value.trim()) showSuggest(e.target.value);
});
document.getElementById('station-search').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const kw = e.target.value.trim();
    if (!kw) return;
    const match = stationData.find(d => d.n.id.includes(kw) && !selected.includes(d.n.id));
    if (match) addStation(match.n.id);
});
document.getElementById('btn-find').addEventListener('click', findMidpoint);
document.getElementById('btn-clear').addEventListener('click', clearAll);
document.getElementById('btn-reset').addEventListener('click', () => applyInitialView(true));
document.getElementById('btn-zoom-in').addEventListener('click', () => {
    svg.transition().duration(220).call(zoom.scaleBy, 1.3);
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
    svg.transition().duration(220).call(zoom.scaleBy, 1 / 1.3);
});
document.getElementById('btn-fit').addEventListener('click', fitAll);

let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 180);
});
</script>
